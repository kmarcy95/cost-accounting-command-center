<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cost Accounting Command Center</title>
  <meta name="description" content="An AI-assisted cost accounting workspace for manufacturing — standard costing & variance, product costing (job-order / process / ABC), inventory valuation & cost flows, CVP, and a Day-1 cost-system diagnostic." />
  <meta name="theme-color" content="#0f172a" />
  <meta property="og:title" content="Cost Accounting Command Center" />
  <meta property="og:description" content="AI-assisted manufacturing cost accounting: variance analysis, product costing, inventory cost flows, CVP, and a consultant's Day-1 diagnostic." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6cbd'/%3E%3Ctext x='16' y='22' font-family='Segoe UI,Arial' font-size='16' font-weight='700' text-anchor='middle' fill='white'%3EC%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
    integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4"
    crossorigin="anonymous"></script>
</head>
<body>
  <a class="skip-link" href="#view" style="position:absolute;left:-9999px">Skip to content</a>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">C</div>
        <div>
          <div class="brand-name">Command Center</div>
          <div class="brand-sub" id="brandSub">Cost Accounting</div>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="Primary"></nav>
      <div class="sidebar-foot">Cost Accounting Command Center · v1.0</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="viewTitle">Dashboard</h1>
          <div class="crumb" id="viewCrumb"></div>
        </div>
        <div class="topbar-actions">
          <div class="gfilter" id="globalFilter" aria-label="Global filters"></div>
          <div class="ticker" id="ticker" aria-label="Key metrics"></div>
          <button class="cmd-btn" onclick="window.CACC.openPalette()" aria-label="Open command palette">
            <span>Jump</span><kbd>Ctrl K</kbd>
          </button>
          <button class="cmd-btn" id="themeToggle" onclick="window.CACC.toggleTheme()" aria-label="Toggle dark terminal mode">
            <span>Terminal</span>
          </button>
          <button class="cmd-btn" id="densityToggle" onclick="window.CACC.toggleDensity()" aria-label="Toggle row density">
            <span>Compact</span>
          </button>
          <span class="pill-env">Demo · seeded data</span>
        </div>
      </header>
      <div class="content" id="view"></div>
    </main>
  </div>

  <!-- Pure engines (also unit-tested under /tests via require) -->
  <script src="engines/cost-variance-engine.js"></script>
  <script src="engines/product-costing-engine.js"></script>
  <script src="engines/inventory-engine.js"></script>
  <script src="engines/cvp-engine.js"></script>
  <script src="engines/diagnostic-engine.js"></script>
  <script src="engines/inventory-reserve-engine.js"></script>
  <script src="engines/journal-entries-engine.js"></script>
  <script src="engines/cube-engine.js"></script>
  <!-- Data + store + derived model -->
  <script src="assets/seed-data.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/model.js"></script>
  <!-- AI layer -->
  <script src="ai/insights.js"></script>
  <script src="ai/claude-client.js"></script>
  <!-- App core (defines CACC.ui, icons, router) — must load before views -->
  <script src="assets/app.js"></script>
  <script src="assets/grid.js"></script>
  <!-- Views register into CACC.views -->
  <script src="views/executive-overview.js"></script>
  <script src="views/profitability-cube.js"></script>
  <script src="views/budget-actual.js"></script>
  <script src="views/inventory-subledger.js"></script>
  <script src="views/cost-ledger.js"></script>
  <script src="views/procurement.js"></script>
  <script src="views/projects.js"></script>
  <script src="views/financials.js"></script>
  <script src="views/workforce.js"></script>
  <script src="views/warehouse.js"></script>
  <script src="views/sales-orders.js"></script>
  <script src="views/item-revaluation.js"></script>
  <script src="views/quotes.js"></script>
  <script src="views/resource-scheduling.js"></script>
  <script src="views/report-builder.js"></script>
  <script src="views/dashboard.js"></script>
  <script src="views/trends.js"></script>
  <script src="views/standard-costing.js"></script>
  <script src="views/product-costing.js"></script>
  <script src="views/inventory.js"></script>
  <script src="views/inventory-reserve.js"></script>
  <script src="views/cvp.js"></script>
  <script src="views/capacity.js"></script>
  <script src="views/profitability.js"></script>
  <script src="views/item-master.js"></script>
  <script src="views/journal.js"></script>
  <script src="views/diagnostic.js"></script>
  <script src="views/settings.js"></script>
  <!-- Boot after everything is registered -->
  <script>window.CACC.boot();</script>
</body>
</html>
